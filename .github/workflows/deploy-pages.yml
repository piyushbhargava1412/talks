name: Deploy talks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Each talk is its own pnpm project with its own lockfile.
          cache-dependency-path: '**/pnpm-lock.yaml'

      # Builds every talk (any top-level dir with a slides.md) into site/,
      # plus a generated landing page linking to each — see the script for
      # details. No workflow edit needed when a new talk folder is added.
      - name: Build all talks
        run: node scripts/build-all-talks.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
